name: VALERIA Tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install loguru rich pyyaml psutil pytest pytest-asyncio
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt || true
          fi

      - name: Run tests
        env:
          PYTHONPATH: .
        run: pytest TESTS/ -q --tb=short

      - name: Holistic smoke
        env:
          PYTHONPATH: .
        run: |
          python -c "
          from pathlib import Path
          from SISTEMAS_AVANZADOS.ANALIZADOR_HOLISTICO_CODIGO import OrquestadorHolistico
          h = OrquestadorHolistico(Path('.').resolve())
          inf = h.analizar()
          assert inf['resumen']['archivos'] > 0
          print('holistico ok', inf['resumen']['archivos'], 'files')
          "
